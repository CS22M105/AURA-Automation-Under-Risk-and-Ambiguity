[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "aura-banking"
version = "0.1.0"
description = "Risk-aware deferral for banking intent classification"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "joblib>=1.4",
    "numpy>=2.1",
    "pandas>=2.2",
    "PyYAML>=6.0",
    "scikit-learn>=1.7",
    "scipy>=1.14",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.15",
    "pandas-stubs>=2.2",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.11",
    "types-PyYAML>=6.0",
]
transformer = [
    "torch>=2.7",
    "transformers>=4.52,<6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
disallow_untyped_defs = true
warn_return_any = true
warn_unused_configs = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["joblib", "scipy.*", "sklearn.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--strict-markers --strict-config"

[tool.coverage.run]
source = ["aura"]
branch = true
