schema_version: 1

evidence_sources:
  uk_psr_security_notification:
    title: UK Payment Services Regulations 2017, regulations 72-73
    url: https://www.legislation.gov.uk/uksi/2017/752/part/7/crossheading/authorisation-of-payment-transactions/made?view=extent
    supports: Prompt notification and prevention of further use after loss, theft, misappropriation, or unauthorized use.
    supported_consequence_flags: [protective_action]
  uk_psr_unauthorized_payment:
    title: UK Payment Services Regulations 2017, regulations 74-77
    url: https://www.legislation.gov.uk/uksi/2017/752/part/7/crossheading/authorisation-of-payment-transactions/made?view=extent
    supports: Investigation, liability, restoration, and timely refund obligations for unauthorized payment transactions.
    supported_consequence_flags: [unauthorized_transaction, transaction_correction]
  uk_psr_execution_correction:
    title: UK Payment Services Regulations 2017, regulations 74 and 81-94
    url: https://www.legislation.gov.uk/uksi/2017/752/2026-04-28/data.htm
    supports: Notification, refusal, revocation, execution timing, tracing, correction, refund, and liability rules for payment transactions.
    supported_consequence_flags: [transaction_correction]
  uk_psr_charges_exchange:
    title: UK Payment Services Regulations 2017, regulations 43-61, 66, and 84
    url: https://www.legislation.gov.uk/uksi/2017/752/contents
    supports: Information and disclosure requirements for transaction charges and exchange rates, plus rules governing deductions from transferred amounts.
    supported_consequence_flags: [transaction_correction]
  fatf_customer_due_diligence:
    title: FATF Recommendations, amended June 2026, Recommendation 10
    url: https://www.fatf-gafi.org/en/publications/Fatfrecommendations/Fatf-recommendations.html
    supports: Risk-based customer identity verification, ongoing due diligence, and source-of-funds scrutiny where necessary.
    supported_consequence_flags: [compliance_sensitive]
  fca_fraudulent_payments_2026:
    title: FCA Fraudulent payments consumer guidance, updated 15 May 2026
    url: https://www.fca.org.uk/consumers/fraudulent-payments
    supports: Prompt reporting, investigation, protection, and refund handling for unauthorized payments and compromised access credentials.
    supported_consequence_flags: [protective_action, unauthorized_transaction, transaction_correction]

