repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: ruff check
        language: system
        types: [python]

      - id: ruff-format
        name: Ruff format
        entry: ruff format --check
        language: system
        types: [python]

      - id: mypy
        name: Mypy type check
        entry: python -m mypy src tests
        language: system
        pass_filenames: false

      - id: pytest
        name: Pytest
        entry: python -m pytest -q
        language: system
        pass_filenames: false
